name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server worker + node, web vue-tsc)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (web + node bundle)
        run: npm run build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir dist-worker
