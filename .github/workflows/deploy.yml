name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: edgedock
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Create D1 database if missing
        id: d1
        run: |
          get_id() {
            npx wrangler d1 list --json | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const db = JSON.parse(s.slice(s.indexOf("["))).find((d) => d.name === process.env.D1_NAME);
                process.stdout.write(db ? db.uuid : "");
              });'
          }
          DB_ID="$(get_id)"
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database $D1_NAME"
            npx wrangler d1 create "$D1_NAME"
            DB_ID="$(get_id)"
          fi
          if [ -z "$DB_ID" ]; then echo "::error::Could not determine D1 database id"; exit 1; fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Patch database_id in wrangler.toml
        run: |
          sed -i -E 's/^database_id = ".*"/database_id = "${{ steps.d1.outputs.database_id }}"/' wrangler.toml
          grep -n '^database_id' wrangler.toml

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: Prepare secrets
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node -e '
            const keys = ["ENCRYPTION_KEY", "JWT_SECRET", "ADMIN_USERNAME", "ADMIN_PASSWORD"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));
            console.log("secrets to upload:", Object.keys(out).join(", ") || "(none)");
            if (!out.ENCRYPTION_KEY) console.log("::warning::ENCRYPTION_KEY repo secret not set; make sure the Worker already has it (npx wrangler secret put ENCRYPTION_KEY).");
          '

      - name: Deploy
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
