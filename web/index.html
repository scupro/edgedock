<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // apply the saved light / dark theme before first paint
      (function () {
        try {
          var m = localStorage.getItem('edgedock.theme');
          var d = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>EdgeDock</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>EdgeDock 需要啟用 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
